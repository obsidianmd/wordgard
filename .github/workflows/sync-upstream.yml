name: Sync upstream

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Prepare sync
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CONFLICT_ISSUE_TITLE: Upstream synchronization requires manual conflict resolution
      SYNC_BRANCH: automation/upstream-sync
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://code.haverbeke.berlin/wordgard/wordgard.git
          git fetch upstream main

      - name: Stage trusted orchestration helper
        run: install -m 700 bin/upstream-sync-workflow.sh "$RUNNER_TEMP/upstream-sync-workflow.sh"

      - name: Prepare synchronization branch
        id: prepare
        continue-on-error: true
        run: bin/prepare-upstream-sync.sh upstream/main "$SYNC_BRANCH"

      - name: Fail on an unexpected preparation error
        if: steps.prepare.outcome == 'failure' && steps.prepare.outputs.status != 'conflict'
        run: exit 1

      - name: Check whether CI workflow is trusted
        id: trust
        if: steps.prepare.outputs.status == 'merged'
        run: |
          "$RUNNER_TEMP/upstream-sync-workflow.sh" check-ci main HEAD

      - name: Push branch and open or update pull request
        if: steps.prepare.outputs.status == 'merged'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRUSTED_CI: ${{ steps.trust.outputs.trusted_ci }}
          UPSTREAM_SHA: ${{ steps.prepare.outputs.upstream_sha }}
        run: |
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"
          cat > "$RUNNER_TEMP/upstream-sync-pr.md" <<EOF
          This pull request merges canonical \`upstream/main\` at
          \`$UPSTREAM_SHA\` into the maintained Obsidian fork.

          Workflow run: $RUN_URL

          Fork patch review:
          1. Run \`git cherry -v upstream/main main\` as an advisory equivalence check.
          2. Review every \`active\` entry in \`FORK_PATCHES.md\` against its upstream issue.
          3. After merging this PR, mark incorporated patches \`absorbed\` with the upstream commit SHA; do not revert their historical code commits.
          EOF
          if [[ $TRUSTED_CI == 'true' ]]; then
            cat >> "$RUNNER_TEMP/upstream-sync-pr.md" <<'EOF'

          Review the diff and wait for `CI / Test` before merging.
          EOF
          else
            cat >> "$RUNNER_TEMP/upstream-sync-pr.md" <<'EOF'

          > [!WARNING]
          > CI workflow changes require manual review; automatic CI dispatch is disabled.
          > Review `.github/workflows/ci.yml` before running any checks from this branch.
          EOF
          fi
          pr_number=$(gh pr list --base main --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')
          if [[ -z $pr_number ]]; then
            gh pr create --base main --head "$SYNC_BRANCH" \
              --title "Merge upstream Wordgard changes" \
              --body-file "$RUNNER_TEMP/upstream-sync-pr.md"
          else
            gh pr edit "$pr_number" \
              --title "Merge upstream Wordgard changes" \
              --body-file "$RUNNER_TEMP/upstream-sync-pr.md"
          fi

      - name: Dispatch trusted CI
        if: steps.prepare.outputs.status == 'merged' && steps.trust.outputs.trusted_ci == 'true'
        run: gh workflow run ci.yml --ref "$SYNC_BRANCH"

      - name: Create or update conflict issue
        if: steps.prepare.outputs.status == 'conflict'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPSTREAM_SHA: ${{ steps.prepare.outputs.upstream_sha }}
        run: |
          issue_record=$("$RUNNER_TEMP/upstream-sync-workflow.sh" find-issue all "$CONFLICT_ISSUE_TITLE")
          IFS=$'\t' read -r issue_number issue_state <<< "$issue_record"
          cat > "$RUNNER_TEMP/upstream-sync-conflict.md" <<EOF
          Automation could not merge canonical commit
          \`$UPSTREAM_SHA\` into the Obsidian fork.
          The merge was aborted and no conflict markers were pushed.

          Failed run: $RUN_URL

          Follow the manual conflict-recovery procedure in \`FORK_MAINTENANCE.md\`.
          EOF
          if [[ -z $issue_number ]]; then
            gh issue create --title "$CONFLICT_ISSUE_TITLE" \
              --body-file "$RUNNER_TEMP/upstream-sync-conflict.md"
          else
            if [[ $issue_state == closed ]]; then
              gh issue reopen "$issue_number"
            fi
            gh issue comment "$issue_number" \
              --body-file "$RUNNER_TEMP/upstream-sync-conflict.md"
          fi

      - name: Close resolved conflict issue
        if: steps.prepare.outputs.status == 'no_changes' || steps.prepare.outputs.status == 'merged'
        run: |
          issue_record=$("$RUNNER_TEMP/upstream-sync-workflow.sh" find-issue open "$CONFLICT_ISSUE_TITLE")
          IFS=$'\t' read -r issue_number _ <<< "$issue_record"
          if [[ -n $issue_number ]]; then
            gh issue close "$issue_number" \
              --comment "Upstream synchronization no longer conflicts."
          fi

      - name: Fail after opening a PR with changed CI
        if: steps.prepare.outputs.status == 'merged' && steps.trust.outputs.trusted_ci == 'false'
        run: |
          printf 'The synchronization PR changes ci.yml; automatic CI dispatch was blocked.\n' >&2
          exit 1

      - name: Fail after reporting a conflict
        if: steps.prepare.outputs.status == 'conflict'
        run: exit 1
